spring:
  datasource:
    # Base H2 en mémoire : elle est recréée à chaque démarrage du service.
    # Pour utiliser PostgreSQL installé sur la machine, remplacer ces trois lignes par :
    #   url: jdbc:postgresql://localhost:5432/order_db
    #   username: order
    #   password: order
    url: jdbc:h2:mem:order_db;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      # Console web de la base : http://localhost:8082/h2-console
      # (JDBC URL : jdbc:h2:mem:order_db, utilisateur : sa, sans mot de passe)
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          catalog-service:
            connect-timeout: 1000   # ms pour établir la connexion
            read-timeout: 2000      # ms pour recevoir la réponse
            logger-level: basic

logging:
  level:
    # Le niveau DEBUG est nécessaire pour voir les logs Feign
    com.shopflow.order.client.CatalogClient: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      catalog:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - com.shopflow.order.exception.InvalidOrderException
  retry:
    instances:
      catalog:
        max-attempts: 3
        wait-duration: 300ms
        ignore-exceptions:
          - com.shopflow.order.exception.InvalidOrderException
          - com.shopflow.order.exception.CircuitBreakerOpenException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
