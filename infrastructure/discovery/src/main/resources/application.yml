server:
  port: 8761

spring:
  application:
    name: discovery

eureka:
  client:
    # C'est l'annuaire lui-même : il ne s'inscrit pas et ne cherche pas d'autre serveur
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
