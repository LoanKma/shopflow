plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.shopflow'
version = '0.0.1-SNAPSHOT'
description = "ShopFlow - porte d'entrée unique"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Version de Spring Cloud compatible avec Spring Boot 4.2 (train 2026.0, « Paddington »)
ext {
    set('springCloudVersion', '2026.0.0')
}

dependencies {
    // La Gateway tourne sur WebFlux (Netty) : surtout pas de spring-boot-starter-webmvc ici
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    // Trouve les services dans Eureka (lb://...) et lit ses routes dans config-repo/gateway.yml
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Le BOM Spring Cloud fixe les versions de toutes les briques Spring Cloud
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
